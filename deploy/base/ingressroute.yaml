# Traefik IngressRoute (this cluster's Traefik watches the CRD provider, not
# standard Ingress). Mirrors the existing plane-ingress-route pattern.
# TLS secret plane-tracker-tls is produced by certificate.yaml (cert-manager).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane-tracker
spec:
  # Public: traefik-external (the public load balancer) serves only routes of
  # class `traefik` (terraform-scripts traefik_public_ingress_class). Without it,
  # only the internal load balancer would serve plane-tracker.plane.tools.
  ingressClassName: traefik
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`plane-tracker.plane.tools`) && PathPrefix(`/`)
      services:
        - name: plane-tracker
          port: 80
  tls:
    secretName: plane-tracker-tls
